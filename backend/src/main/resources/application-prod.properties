spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

app.security.enabled=${PROJECTMANAGER_AUTH_ENABLED:true}
app.security.username=${PROJECTMANAGER_ADMIN_USERNAME}
app.security.password=${PROJECTMANAGER_ADMIN_PASSWORD}
app.security.email=${PROJECTMANAGER_ADMIN_EMAIL:admin@projectmanager.local}
app.cors.allowed-origins=${PROJECTMANAGER_CORS_ALLOWED_ORIGINS}

server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=always
